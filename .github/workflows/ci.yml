name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "beautifulsoup4>=4.12,<5"
      - run: python -m unittest discover -s scripts/ai_reading -t . -v
      - run: npm ci --prefix worker
      - run: npm run check --prefix worker
      - run: npm test --prefix worker
