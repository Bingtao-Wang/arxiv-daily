name: Generate AI paper reading
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Worker job ID
        required: true
        type: string
      arxiv_id:
        description: Bare arXiv paper ID
        required: true
        type: string
      run_token:
        description: Worker-issued per-run authorization token
        required: true
        type: string
      version:
        description: Optional locked arXiv version
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ai-paper-reading
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/ai_reading/requirements.txt
      - name: Validate Worker dispatch before dependency install
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_READING_API_BASE: ${{ vars.AI_READING_API_BASE }}
          AI_READING_CALLBACK_SECRET: ${{ secrets.AI_READING_CALLBACK_SECRET }}
          AI_READING_JOB_ID: ${{ inputs.job_id }}
          AI_READING_ARXIV_ID: ${{ inputs.arxiv_id }}
          AI_READING_RUN_TOKEN: ${{ inputs.run_token }}
        run: |
          [[ "$AI_READING_RUN_TOKEN" =~ ^[A-Za-z0-9_-]{40,128}$ ]] || exit 1
          echo "::add-mask::$AI_READING_RUN_TOKEN"
          python -m scripts.ai_reading.preflight
      - name: Install reading dependencies
        id: install
        run: python -m pip install -r scripts/ai_reading/requirements.txt
      - name: Report dependency installation failure
        if: failure() && steps.install.outcome == 'failure'
        env:
          AI_READING_API_BASE: ${{ vars.AI_READING_API_BASE }}
          AI_READING_CALLBACK_SECRET: ${{ secrets.AI_READING_CALLBACK_SECRET }}
          AI_READING_JOB_ID: ${{ inputs.job_id }}
          AI_READING_ARXIV_ID: ${{ inputs.arxiv_id }}
          AI_READING_RUN_TOKEN: ${{ inputs.run_token }}
        run: python -m scripts.ai_reading.fail_install
      - name: Generate and publish report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_READING_API_BASE: ${{ vars.AI_READING_API_BASE }}
          AI_READING_CALLBACK_SECRET: ${{ secrets.AI_READING_CALLBACK_SECRET }}
          AI_READING_MODEL: gpt-6.1-sol
          AI_READING_REASONING_EFFORT: low
          AI_READING_BUDGET_USD: '1.0'
          # 预算估算费率，部署时须按官方实际价格核对。
          AI_READING_INPUT_USD_PER_M: '2'
          AI_READING_OUTPUT_USD_PER_M: '10'
          AI_READING_JOB_ID: ${{ inputs.job_id }}
          AI_READING_ARXIV_ID: ${{ inputs.arxiv_id }}
          AI_READING_RUN_TOKEN: ${{ inputs.run_token }}
          AI_READING_VERSION: ${{ inputs.version }}
        run: |
          [[ "$AI_READING_RUN_TOKEN" =~ ^[A-Za-z0-9_-]{40,128}$ ]] || exit 1
          echo "::add-mask::$AI_READING_RUN_TOKEN"
          python -m scripts.ai_reading.run \
            --job-id "$AI_READING_JOB_ID" \
            --arxiv-id "$AI_READING_ARXIV_ID" \
            --version "$AI_READING_VERSION"
