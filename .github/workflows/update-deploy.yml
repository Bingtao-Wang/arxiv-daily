name: Update and deploy
on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Shanghai (01:00 UTC), with a 09:17 retry if no update succeeded.
    - cron: '0 1 * * *'
    - cron: '17 1 * * *'
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
    steps:
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" != schedule ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u +'%Y-%m-%dT01:00:00Z')"
          if runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-deploy.yml/runs?per_page=100")"; then
            if jq -e --arg since "$since" '[.workflow_runs[] | select(.created_at >= $since and .conclusion == "success")] | length > 0' <<< "$runs" >/dev/null; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "A successful update already ran today."
              exit 0
            fi
          else
            echo "Could not check previous runs; proceeding with the update."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Data stays outside source control; each successful run saves its history.
      - uses: actions/cache/restore@v4
        with:
          path: shared/static/data/papers.ts
          key: papers-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: papers-
      - name: Fetch arXiv metadata
        env:
          ARXIV_SOURCE: oai
        run: npm run fetch:arxiv -- --days 7 --max 1000
      - run: npm test
      - name: Build for this Pages repository
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          VITE_AI_API_BASE: ${{ vars.VITE_AI_API_BASE }}
        run: |
          if [[ "$REPOSITORY" == *.github.io ]]; then
            export VITE_BASE_PATH=/
          else
            export VITE_BASE_PATH="/$REPOSITORY/"
          fi
          npm run build
      - uses: actions/cache/save@v4
        with:
          path: shared/static/data/papers.ts
          key: papers-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: paper-data-${{ github.run_id }}
          path: shared/static/data/papers.ts
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
